# Прод ARCONdemo на том же Timeweb VPS, что и timetracker.
# Свой Caddy НЕ поднимаем — порты 80/443 уже заняты Caddy от timetracker.
# App-контейнер живёт в общей внешней сети `edge`, а в Caddyfile того Caddy
# добавляется блок:
#     arcondemo.tesmika.ru { reverse_proxy arcondemo-app:3000 }
# (готовый блок — в deploy/Caddyfile.arcondemo, инструкция — в DEPLOY.md).
#
# Разовая подготовка сети на сервере:
#   docker network create edge                       # если сети ещё нет
#   docker network connect edge <caddy-контейнер>    # подключить существующий Caddy
#
# Деплой / обновление:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build: .
    container_name: arcondemo-app
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - '3000'
    restart: unless-stopped
    networks:
      - edge

networks:
  edge:
    external: true
